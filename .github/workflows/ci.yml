name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create dummy .env for CI
        run: |
          echo "BINANCE_TESTNET_API_KEY=ci_dummy_key" >> .env
          echo "BINANCE_TESTNET_API_SECRET=ci_dummy_secret" >> .env

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=bot \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: Flake8 (PEP8 compliance)
        run: |
          flake8 bot/ core/ cli.py \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --statistics

  docker:
    name: "Docker Build Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t binance-futures-bot:ci .

      - name: Verify image runs
        run: docker run --rm binance-futures-bot:ci --help
